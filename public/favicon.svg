<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  
  <!-- Brand mark: three stacked offset cards with strokes -->
  <g stroke="#a9c7e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back card (darkest) -->
    <rect x="4" y="14" width="12" height="12" rx="2" opacity="0.4"/>
    <!-- Middle card -->
    <rect x="10" y="10" width="12" height="12" rx="2" opacity="0.7"/>
    <!-- Front card (brightest) -->
    <rect x="16" y="6" width="12" height="12" rx="2"/>
  </g>
</svg>
