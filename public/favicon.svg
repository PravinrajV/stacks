<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Stylized stack of three overlapping cards at 45° rotation -->
  <!-- Bottom card -->
  <rect x="1" y="8" width="7" height="6" rx="1" fill="currentColor" opacity="0.6"/>
  <!-- Middle card -->
  <rect x="4" y="5" width="7" height="6" rx="1" fill="currentColor" opacity="0.8"/>
  <!-- Top card -->
  <rect x="7" y="2" width="7" height="6" rx="1" fill="currentColor"/>
</svg>
